# contract_only_visibility_variations.yaml
# Tests the four contract types under two visibility regimes:
#   - other_player_visible = [false, false] (opponent hidden)
#   - other_player_visible = [true, true]   (opponent fully visible)
# All variants run in contract_only mode (game ends after contract negotiation on turn 0).

# # -------------------------
# # Block 1: contract_type = null, opponent hidden
# # -------------------------
# - with_message_history: false
#   pay4partner: true
#   contract_type: null
#   contract_only: true
#   fog_of_war: [false, false]
#   other_player_visible: [false, false]
#   selfish: [true, true]

# # -------------------------
# # Block 2: contract_type = null, opponent visible
# # -------------------------
# - with_message_history: false
#   pay4partner: true
#   contract_type: null
#   contract_only: true
#   fog_of_war: [false, false]
#   other_player_visible: [true, true]
#   selfish: [true, true]

# -------------------------
# Block 3: contract_type = strict, opponent hidden
# -------------------------
- with_message_history: false
  pay4partner: true
  contract_type: strict
  contract_only: true
  negotiation_internal_reasoning: true
  fog_of_war: [false, false]
  other_player_visible: [false, false]
  selfish: [true, true]

# -------------------------
# Block 4: contract_type = strict, opponent visible
# -------------------------
- with_message_history: false
  pay4partner: true
  contract_type: strict
  contract_only: true
  negotiation_internal_reasoning: true
  fog_of_war: [false, false]
  other_player_visible: [true, true]
  selfish: [true, true]

# -------------------------
# Block 5: contract_type = contract_for_finishing, opponent hidden
# -------------------------
- with_message_history: false
  pay4partner: true
  contract_type: contract_for_finishing
  contract_only: true
  negotiation_internal_reasoning: true
  fog_of_war: [false, false]
  other_player_visible: [false, false]
  selfish: [true, true]

# -------------------------
# Block 6: contract_type = contract_for_finishing, opponent visible
# -------------------------
