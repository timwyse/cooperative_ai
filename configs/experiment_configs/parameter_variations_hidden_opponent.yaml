# parameter_variations_hidden_opponent.yaml
# All variants below run with pay4partner=true AND other_player_visible=[false, false]
# (player cannot see opponent's position, goal, inventory, best path, or per-turn moves)

# Block 1: contract_type = null
- with_message_history: false
  pay4partner: true
  contract_type: null
  fog_of_war: [false, false]
  other_player_visible: [false, false]
  selfish: [true, true]

# Block 2: contract_type = strict
- with_message_history: false
  pay4partner: true
  contract_type: strict
  fog_of_war: [false, false]
  other_player_visible: [false, false]
  selfish: [true, true]

# Block 3: contract_type = contract_for_finishing
- with_message_history: false
  pay4partner: true
  contract_type: contract_for_finishing
  fog_of_war: [false, false]
  other_player_visible: [false, false]
  selfish: [true, true]

# Block 4: contract_type = tile_with_judge_implementation
- with_message_history: false
  pay4partner: true
  contract_type: tile_with_judge_implementation
  fog_of_war: [false, false]
  other_player_visible: [false, false]
  selfish: [true, true]
